name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUDRALIPI_SKIP_VISUAL: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run verify:release
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            apps/visual-tests/playwright-report
            apps/visual-tests/test-results
          if-no-files-found: ignore
          retention-days: 7

  visual:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bunx --no-install playwright install chromium
      - run: bun run build
      - run: bun --filter @rudralipi/visual-tests test
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-results
          path: |
            apps/visual-tests/playwright-report
            apps/visual-tests/test-results
          if-no-files-found: ignore
          retention-days: 7
