name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUDRALIPI_SKIP_VISUAL: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @rudralipi/visual-tests exec playwright install --with-deps chromium
      - run: yarn verify:release
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            apps/visual-tests/playwright-report
            apps/visual-tests/test-results
          if-no-files-found: ignore
          retention-days: 7

  visual:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @rudralipi/visual-tests exec playwright install chromium
      - run: yarn build
      - run: yarn workspace @rudralipi/visual-tests test
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-results
          path: |
            apps/visual-tests/playwright-report
            apps/visual-tests/test-results
          if-no-files-found: ignore
          retention-days: 7
